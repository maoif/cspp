name: Build, test, and release master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Cancel unfinished runs on new pushes; previously published releases are preserved.
concurrency:
  group: master-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            runner: ubuntu-24.04
            image: ubuntu:24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-24.04
            image: ubuntu:24.04
            emulation: riscv64
          - arch: loongarch64
            platform: linux/loong64
            runner: ubuntu-24.04
            image: lcr.loongnix.cn/library/debian@sha256:c0aa9264c13b608f40a3bf7b9c7662720b6b93839013038df9c3b079835c228f
            emulation: loong64
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Enable architecture emulation
        if: matrix.emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: ${{ matrix.emulation }}
      - name: Build, run non-net tests, and package installed artifacts
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --platform "$TARGET_PLATFORM" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            "$TARGET_IMAGE" \
            bash tools/ci-build.sh "$TARGET_ARCH" "$GITHUB_SHA"
      - name: Smoke-test archive in a clean runtime
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --platform "$TARGET_PLATFORM" \
            -v "$GITHUB_WORKSPACE/dist:/packages:ro" \
            -v "$GITHUB_WORKSPACE/tools/package-smoke.ss:/smoke.ss:ro" \
            "$TARGET_IMAGE" bash -c '
              set -euo pipefail
              archives=(/packages/*.tar.gz)
              test "${#archives[@]}" -eq 1
              mkdir -p "/tmp/relocated package"
              tar xzf "${archives[0]}" -C "/tmp/relocated package"
              launchers=(/tmp/relocated\ package/*/bin/cspp)
              test "${#launchers[@]}" -eq 1
              cd /
              "${launchers[0]}" --script=/smoke.ss
            '
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cspp-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish per-commit master prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all tested packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cspp-linux-*
          merge-multiple: true
          path: dist
      - name: Verify and publish packages together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          python3 - <<'PY'
          import glob, json, os, tarfile
          architectures = set()
          versions = set()
          requirements = {}
          archives = glob.glob('*.tar.gz')
          if len(archives) != 4:
              raise SystemExit('expected four architecture archives')
          for archive in archives:
              with tarfile.open(archive) as stream:
                  members = [m for m in stream.getmembers() if m.name.endswith('/BUILD-INFO.json')]
                  if len(members) != 1:
                      raise SystemExit('missing or ambiguous build metadata')
                  with stream.extractfile(members[0]) as metadata:
                      info = json.load(metadata)
              if info['commit'] != os.environ['GITHUB_SHA']:
                  raise SystemExit('package commit mismatch')
              architectures.add(info['arch'])
              versions.add(info['version'])
              requirements[info['arch']] = info['host_requirements']
          if architectures != {'x64', 'arm64', 'riscv64', 'loongarch64'} or len(versions) != 1:
              raise SystemExit('package architecture/version mismatch')
          with open('release-notes.md', 'w') as notes:
              notes.write(f"Master snapshot of `{os.environ['GITHUB_SHA']}`.\n\n")
              notes.write(f"CSPP version: `{versions.pop()}`.\n\n")
              notes.write('Linux packages built on Ubuntu 24.04 for x64, arm64, and riscv64, '
                          'and Loongnix Debian for loongarch64. All non-net tests passed on '
                          'every architecture. RISC-V and LoongArch use QEMU.\n\n')
              for arch in sorted(requirements):
                  notes.write(f"- `{arch}`: {', '.join(requirements[arch])}.\n")
              notes.write('\nExtract an archive anywhere and run `bin/cspp` on the '
                          'matching CPU architecture. Recursive shared '
                          'library dependencies are bundled, except host glibc and its loader. '
                          'Build metadata is included.\n')
          PY
          release_title="CSPP master snapshot (${GITHUB_SHA:0:7})"
          release_tag="master-$GITHUB_SHA"
          if gh api "repos/$GH_REPO/git/ref/tags/$release_tag" > /dev/null 2>&1; then
            :
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$release_tag" -f sha="$GITHUB_SHA"
          fi
          if gh release view "$release_tag" > /dev/null 2>&1; then
            existing_assets=$(gh release view "$release_tag" --json assets --jq '.assets[].name')
            for archive in ./*.tar.gz; do
              archive=${archive#./}
              asset="$archive"
              if grep -Fxq "$asset" <<< "$existing_assets"; then
                echo "Keeping existing release asset: $asset"
                continue
              fi
              gh release upload "$release_tag" "$archive"
            done
          else
            # Keep interrupted uploads private until the complete release is ready.
            gh release create "$release_tag" ./*.tar.gz --verify-tag \
              --draft --prerelease --latest=false --title "$release_title" \
              --notes-file release-notes.md
          fi
          gh release edit "$release_tag" --draft=false --prerelease --latest=false \
            --title "$release_title" --notes-file release-notes.md
